
<div class="flex flex-col h-full w-full max-w-md mx-auto bg-black relative shadow-2xl overflow-hidden">
  
  @if (showAuth()) {
    <!-- Auth / Landing Screen -->
    <app-auth class="h-full w-full"></app-auth>
  } @else {
    <!-- Main App -->
    <main class="flex-grow overflow-hidden relative">
      @switch (store.currentView()) {
        @case ('FEED') {
          <app-feed></app-feed>
        }
        @case ('UPLOAD') {
          <app-upload></app-upload>
        }
        @case ('PROFILE') {
          <app-profile></app-profile>
        }
      }
    </main>

    <!-- Bottom Navigation -->
    <nav class="h-16 bg-black border-t border-gray-900 flex justify-around items-center px-2 z-50 select-none">
      
      <button (click)="setView('FEED')" 
              class="flex flex-col items-center gap-1 p-2 w-16 transition-colors"
              [class.text-white]="store.currentView() === 'FEED'"
              [class.text-gray-600]="store.currentView() !== 'FEED'">
        <span class="material-icons-round text-2xl">home</span>
        <span class="text-[10px] font-medium">Inicio</span>
      </button>

      <button (click)="setView('UPLOAD')" 
              class="flex items-center justify-center -mt-6 group">
        <div class="w-12 h-8 bg-gradient-to-r from-cyan-400 to-red-400 rounded-lg p-[2px] flex items-center justify-center transform transition group-active:scale-90"
             [class.opacity-50]="!store.isAuthenticated()"
             [class.opacity-100]="store.isAuthenticated()">
          <div class="w-full h-full bg-black rounded-[6px] flex items-center justify-center">
            <span class="material-icons-round text-white text-xl">add</span>
          </div>
        </div>
      </button>

      <button (click)="setView('PROFILE')" 
              class="flex flex-col items-center gap-1 p-2 w-16 transition-colors"
              [class.text-white]="store.currentView() === 'PROFILE'"
              [class.text-gray-600]="store.currentView() !== 'PROFILE'">
        <span class="material-icons-round text-2xl">person</span>
        <span class="text-[10px] font-medium">Perfil</span>
      </button>
      
    </nav>
  }
</div>
